version: "3.9"
services:
  db:
    image: postgres:16
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - portfolio_db:/var/lib/postgresql/data

volumes:
  portfolio_db:
